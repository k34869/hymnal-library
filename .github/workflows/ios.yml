name: Build iOS ipa
on: workflow_dispatch
jobs:
  build_for_macos:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: check-env
        run: |
          xcodebuild -version
      - name: update node npm & install pnpm
        run: |
          npm install -g npm@12.2.0
          npm install -g @nubjs/nub
          npm install -g pnpm
          nub node install 24
          node --version

