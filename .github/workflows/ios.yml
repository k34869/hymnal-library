name: Build iOS ipa
on: workflow_dispatch
jobs:
  build_for_macos:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: check-env
        run: |
          npm --version
          node --version


