name: Build iOS ipa
on: workflow_dispatch
jobs:
  build_for_macos:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: check-env
        run: |
          npm --version
          node --version


