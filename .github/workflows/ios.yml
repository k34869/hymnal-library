name: Build iOS ipa
on: workflow_dispatch
jobs:
  build_for_macos:
    runs-on: macos-15
    steps:
      - name: check-env
        run: |
          node --version
          npm --version
          pwd
      - name: update npm & install pnpm
        run: |
          npm install -g npm@12.2.0
          npm install -g pnpm
          pnpm --version
