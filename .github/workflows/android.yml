name: Build Android apk
on: workflow_dispatch
jobs:
  build_for_macos:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> "$GITHUB_ENV"
          echo "$HOME/Library/Android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/Library/Android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          SDKMANAGER="$HOME/Library/Android/sdk/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Java and Android SDK
        run: |
          java -version
          adb version
          sdkmanager --list_installed
