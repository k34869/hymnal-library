name: Build Android apk
on: workflow_dispatch
jobs:
  build_for_macos:
    runs-on: macos-15
    env:
      keystorepass: ${{ vars.keystorepass }}
      keystorealiaspass: ${{ vars.keystorealiaspass }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> "$GITHUB_ENV"
          echo "$HOME/Library/Android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/Library/Android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          SDKMANAGER="$HOME/Library/Android/sdk/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Project Dependencies
        run: pnpm ci

      - name: Build Web Assets
        run: |
          echo "target = 'mobile'" > .env
          npm run build

      - name: Prepare Capacitor Android Project
        run: npm run sync:android

      - name: Build Android App
        run:  |
          wget https://mfbt5siz.cn-nb1.rainapp.top/d/Local/k34869.key
          chmod +x ./android/gradlew
          echo $keystorepass
          npx cap build android --keystorepath "k34869.key" --keystorepass "$keystorepass" --keystorealias "k34869" --keystorealiaspass "$keystorealiaspass" --androidreleasetype "APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: hymnal-library-android-apk
          path: android/app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error
          retention-days: 7

